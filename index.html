<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%231b355e'/%3E%3Cg fill='none' stroke='%2382b5ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 17 14 12 9 14M19 21 11 19 6 22M19 26 11 28 7 32M20 30 14 34 12 40M28 17 34 12 39 14M29 21 37 19 42 22M29 26 37 28 41 32M28 30 34 34 36 40'/%3E%3Cellipse cx='24' cy='26' rx='6' ry='8' fill='%2382b5ff'/%3E%3Ccircle cx='24' cy='16' r='4' fill='%2382b5ff'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2f;--border:#29374d;--text:#e5edf8;--muted:#a9bad0;--blue:#69a8ff;--green:#62d7a2;--amber:#f5c46e;--red:#ff9292}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #7eb7ff;outline-offset:2px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{background:#080f1c;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{font-weight:800;font-size:19px;letter-spacing:.04em;color:#82b5ff}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:0}.nav{display:grid;gap:4px}.nav button{text-align:left;background:transparent;border:0;color:var(--muted);padding:10px 12px;border-radius:7px}.nav button:hover,.nav button.active{background:#1b355e;color:white}.sidebar-bottom{margin-top:auto;color:var(--muted);font-size:12px}.main{min-width:0}.topbar{background:#0b1424;border-bottom:1px solid var(--border);padding:13px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.topbar input{max-width:480px;flex:1 1 240px}.content{max-width:1500px;margin:auto;padding:24px}.notice{background:#3a2a12;border:1px solid #735223;color:#ffdd9c;border-radius:8px;padding:10px 14px;margin-bottom:20px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:19px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.stack{display:grid;gap:16px}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.columns{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;min-width:0}.metric strong{display:block;font-size:28px;color:var(--blue)}.metric button{background:none;border:0;padding:0;text-align:left;color:inherit;width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button,button.primary,button.secondary,button.danger{border:1px solid var(--border);background:#253851;color:var(--text);border-radius:6px;padding:8px 12px}.button:hover,button.secondary:hover{background:#324a69}button.primary{background:#2563bc;border-color:#3376d8;color:white}button.primary:hover{background:#3479d2}button.danger{background:#45242a;border-color:#74404b}button.link{border:0;background:none;color:var(--blue);padding:0;text-align:left}button.link:hover{text-decoration:underline}button:disabled{opacity:.5;cursor:not-allowed}.badge{display:inline-block;background:#233b5d;color:#b9d8ff;border:1px solid #36567a;border-radius:999px;padding:2px 8px;font-size:11px;white-space:nowrap}.badge.ok{background:#143c32;color:#9be5c2;border-color:#2b6655}.badge.warn{background:#483718;color:#f7d79a;border-color:#715a2c}.badge.danger{background:#4b252a;color:#ffb6b6;border-color:#74434a}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}input,select,textarea{background:#091323;color:var(--text);border:1px solid #40516a;border-radius:6px;padding:8px 10px;width:100%}textarea{resize:vertical;min-height:85px}label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:600}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.fields .wide{grid-column:1/-1}.empty{padding:24px;text-align:center;color:var(--muted)}.list{display:grid;gap:0}.list-item{padding:11px 0;border-bottom:1px solid var(--border)}.list-item:last-child{border-bottom:0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.timeline{border-left:2px solid #375274;margin-left:5px;padding-left:17px}.timeline .list-item{position:relative}.timeline .list-item:before{content:"";position:absolute;left:-23px;top:17px;background:#7db4ff;border:2px solid var(--panel);border-radius:50%;width:9px;height:9px}.dialog-backdrop{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.dialog-backdrop[hidden]{display:none}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#111c2f;border:1px solid #40516a;border-radius:10px;box-shadow:0 12px 50px #0009;padding:22px}.dialog form{display:grid;gap:16px}.dialog h2{margin-bottom:4px}.toast{position:fixed;right:20px;bottom:20px;background:#193b31;color:#c5f8dc;border:1px solid #376f5b;border-radius:7px;padding:11px 16px;z-index:10;max-width:400px}.toast.error{background:#51262c;color:#ffd9d9;border-color:#88444e}.bar{height:8px;background:#23364e;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#609ff5}.print-only{display:none}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidebar-bottom{display:none}.content{padding:16px}.topbar{padding:12px 16px}}
@media print{body{background:white;color:black}.sidebar,.topbar,.notice,.no-print,.toast{display:none!important}.layout{display:block}.content{max-width:none;padding:0}.card{background:white;border:1px solid #bbb;break-inside:avoid}.muted{color:#444}.badge{color:black;background:white;border-color:#888}.print-only{display:block}}
.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:42px;height:42px;flex:none}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="10" fill="#1b355e"/>
        <g fill="none" stroke="#82b5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 17 14 12 9 14M19 21 11 19 6 22M19 26 11 28 7 32M20 30 14 34 12 40M28 17 34 12 39 14M29 21 37 19 42 22M29 26 37 28 41 32M28 30 34 34 36 40"/>
          <ellipse cx="24" cy="26" rx="6" ry="8" fill="#82b5ff"/>
          <circle cx="24" cy="16" r="4" fill="#82b5ff"/>
        </g>
      </svg>
      <div>ARACHNE RMS<small>Interactive records demo</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom">Fictional data only<br>Local browser storage &middot; Demo mode</div>
  </aside>
  <main class="main">
    <header class="topbar no-print">
      <input id="search" type="search" placeholder="Search incidents, people, vehicles, warrants, evidence..." aria-label="Global search">
      <button class="secondary" data-action="search">Search</button>
      <label class="row">Demo role <select id="role" aria-label="Demo role"><option>Officer</option><option>Supervisor</option><option>Administrator</option></select></label>
      <button class="primary" data-action="new-incident">+ New incident</button>
    </header>
    <div class="content">
      <div class="notice no-print"><strong>SIMULATION ONLY.</strong> Fictional records. No real authentication, warrant verification, NIBRS submission, or CJIS compliance. Do not enter real sensitive data.</div>
      <div id="app"></div>
    </div>
  </main>
</div>
<div class="dialog-backdrop" id="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="dialog"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
// Keep the original key so existing demo records survive the rename.
const KEY = 'apex_rms_interactive_demo_v1';
const navItems = [['dashboard','Dashboard'],['incidents','Incidents'],['cases','Cases'],['people','People'],['vehicles','Vehicles'],['evidence','Evidence'],['warrants','Warrants'],['review','Review queue'],['tasks','Tasks'],['analytics','Analytics'],['audit','Audit history'],['settings','Demo settings']];
const initialData = {
  version: 1,
  incidents: [
    {id:'INC-2026-891',type:'Burglary / Breaking & Entering',location:'1042 Market St.',date:'2026-10-28',officer:'Officer J. Miller',status:'Draft',narrative:'Fictional scenario: a shop owner reported a broken rear door and missing equipment. A witness described a vehicle leaving the area.',people:[{id:'P-001',role:'Victim'},{id:'P-002',role:'Witness'},{id:'P-003',role:'Person of interest'}],vehicles:['V-001'],supplements:[],reviewComments:[]},
    {id:'INC-2026-890',type:'Motor Vehicle Theft',location:'405 Pine Street',date:'2026-10-25',officer:'Officer S. Briggs',status:'Approved',narrative:'Fictional scenario: a vehicle was reported missing from a residential parking area.',people:[{id:'P-002',role:'Reporting party'}],vehicles:[],supplements:[],reviewComments:[]}
  ],
  people:[
    {id:'P-001',name:'Alex Rivera',dob:'1986-04-14',aliases:'None listed',description:'Store owner'},
    {id:'P-002',name:'Jordan Ellis',dob:'1992-11-02',aliases:'None listed',description:'Local resident'},
    {id:'P-003',name:'Casey Morgan',dob:'1988-03-19',aliases:'C. Morgan',description:'Fictional person of interest'}
  ],
  vehicles:[{id:'V-001',description:'Blue 2018 sedan',plate:'DEMO-417',incidentIds:['INC-2026-891']}],
  cases:[{id:'CASE-2026-041',title:'Market Street burglary',incidentIds:['INC-2026-891'],assignee:'Detective A. Chen',status:'Open',notes:'Review footage and follow up with the witness.'}],
  evidence:[{id:'E-001',name:'Rear-door photograph',incidentId:'INC-2026-891',location:'Demo evidence locker A',custodian:'Officer J. Miller',history:[{date:'2026-10-28',from:'Collected',to:'Officer J. Miller',note:'Initial simulated intake'}]}],
  warrants:[{id:'W-0421',personId:'P-003',type:'Bench warrant',status:'Listed in demo',issued:'2026-10-12',note:'Fictional record. Status and identity have not been verified.',checks:[]}],
  tasks:[{id:'T-001',title:'Follow up with witness',caseId:'CASE-2026-041',assignee:'Detective A. Chen',due:'2026-11-12',status:'Open'}],
  audit:[{at:'2026-10-28T15:00:00',actor:'Officer J. Miller',action:'Created fictional incident INC-2026-891'}]
};
let db;
let view = {page:'dashboard',id:null,query:''};
let role = 'Officer';
let reportFilters = {from:'',to:'',type:'',status:''};
let toastTimer;
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy = value => JSON.parse(JSON.stringify(value));
const find = (collection,id) => db[collection].find(item => item.id === id);
const label = (collection,id,field='name') => find(collection,id)?.[field] || id;
const today = () => new Date().toISOString().slice(0,10);
const actor = () => ({Officer:'Officer J. Miller',Supervisor:'Supervisor R. Patel',Administrator:'Administrator'})[role];
const stamp = value => { const d = new Date(value); return Number.isNaN(d.getTime()) ? value : d.toLocaleString(); };
const badge = value => `<span class="badge ${['Approved','Completed','Closed'].includes(value)?'ok':['Returned','Pending review','Open'].includes(value)?'warn':''}">${esc(value)}</span>`;
const link = (page,id,text) => `<button class="link" data-action="open" data-page="${esc(page)}" data-id="${esc(id)}">${esc(text)}</button>`;
function flash(message,error=false){const node=$('toast');node.textContent=message;node.className='toast'+(error?' error':'');node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,5000)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(error){flash('Could not save to browser storage: '+error.message,true);return false}}
function record(action){db.audit.unshift({at:new Date().toISOString(),actor:actor(),action})}
function nextId(prefix,records){let n=1;while(records.some(x=>x.id===prefix+String(n).padStart(3,'0')))n++;return prefix+String(n).padStart(3,'0')}
function head(title,subtitle='',actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p class="muted">${esc(subtitle)}</p></div><div class="actions no-print">${actions}</div></div>`}
function btn(action,text,extra='',primary=false){return `<button class="${primary?'primary':'secondary'}" data-action="${action}" ${extra}>${esc(text)}</button>`}
function panel(title,content,actions=''){return `<section class="card"><div class="row between"><h2>${esc(title)}</h2><div class="actions no-print">${actions}</div></div>${content}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No records to display.</td></tr>`}</tbody></table></div>`}
function opts(items,selected='',placeholder='Select...'){return `<option value="">${esc(placeholder)}</option>`+items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.text)}</option>`).join('')}
function show(page,id=null,query=''){view={page,id,query};render();window.scrollTo(0,0)}
function renderNav(){$('nav').innerHTML=navItems.map(([id,text])=>`<button data-action="navigate" data-page="${id}" class="${view.page===id?'active':''}" ${view.page===id?'aria-current="page"':''}>${esc(text)}</button>`).join('')}
function render(){renderNav();const pages={dashboard,incidents,incident,cases,case:caseDetail,people,person,vehicles,vehicle,evidence,'evidence-detail':evidenceDetail,warrants,warrant,review,tasks,analytics,audit,settings,search};$('app').innerHTML=pages[view.page]();$('role').value=role}
function listEvents(items){return items.length?`<div class="list timeline">${items.map(x=>`<div class="list-item"><div>${esc(x.action)}</div><div class="muted small">${esc(x.actor)} &middot; ${esc(stamp(x.at))}</div></div>`).join('')}</div>`:'<p class="empty">No activity yet.</p>'}
function dashboard(){
 const metrics=[['Incidents',db.incidents.length,'incidents'],['Open cases',db.cases.filter(x=>x.status==='Open').length,'cases'],['Awaiting review',db.incidents.filter(x=>x.status==='Pending review').length,'review'],['Open tasks',db.tasks.filter(x=>x.status==='Open').length,'tasks'],['Evidence items',db.evidence.length,'evidence'],['Listed warrants',db.warrants.length,'warrants']];
 return head('Dashboard','A connected, fictional RMS workflow')+`<div class="stack"><div class="grid metrics">${metrics.map(([name,count,page])=>`<div class="card metric"><button data-action="navigate" data-page="${page}"><span class="muted">${name}</span><strong>${count}</strong><span class="small">View records &rarr;</span></button></div>`).join('')}</div><div class="grid columns">${panel('Start the sample scenario',`<p class="muted" style="margin:10px 0">Follow the Market Street burglary from incident through evidence, review and investigation.</p>${link('incident','INC-2026-891','Open sample incident →')}`)}${panel('Recent demo activity',listEvents(db.audit.slice(0,5)),btn('navigate','View all','data-page="audit"'))}</div></div>`
}
function incidents(){return head('Incident reports','Create, review, and explore connected reports',btn('new-incident','+ New incident','',true))+panel('Reports',table(['Incident','Offense','Location','Date','Status','Officer'],db.incidents.map(x=>`<tr><td>${link('incident',x.id,x.id)}</td><td>${esc(x.type)}</td><td>${esc(x.location)}</td><td>${esc(x.date)}</td><td>${badge(x.status)}</td><td>${esc(x.officer)}</td></tr>`)))}
function incident(){
 const x=find('incidents',view.id);if(!x)return missing('incidents');
 const editable=['Draft','Returned'].includes(x.status);
 const actions=btn('navigate','← Incidents','data-page="incidents"')+btn('print','Print report')+(editable?btn('edit-incident','Edit',`data-id="${esc(x.id)}"`)+btn('submit-incident','Submit for review',`data-id="${esc(x.id)}"`,true):'');
 const relatedPeople=x.people.map(p=>`<div class="list-item">${link('person',p.id,label('people',p.id))} <span class="badge">${esc(p.role)}</span></div>`).join('')||'<p class="empty">No people linked.</p>';
 const relatedVehicles=x.vehicles.map(id=>`<div class="list-item">${link('vehicle',id,label('vehicles',id,'description'))}</div>`).join('')||'<p class="empty">No vehicles linked.</p>';
 const relatedEvidence=db.evidence.filter(e=>e.incidentId===x.id);
 const relatedCases=db.cases.filter(c=>c.incidentIds.includes(x.id));
 const supplements=x.supplements.map(s=>`<div class="list-item"><div>${esc(s.text)}</div><div class="small muted">${esc(s.author)} &middot; ${esc(stamp(s.at))}</div></div>`).join('')||'<p class="empty">No supplements yet.</p>';
 const comments=x.reviewComments.map(c=>`<div class="list-item">${badge(c.decision)} ${esc(c.text)}<div class="small muted">${esc(c.author)} &middot; ${esc(stamp(c.at))}</div></div>`).join('')||'<p class="empty">No review decisions yet.</p>';
 return head(x.id,'Incident detail · '+x.type,actions)+`<div class="stack"><div class="grid columns">${panel('Report overview',`<div class="list"><div class="list-item">Status: ${badge(x.status)}</div><div class="list-item">Location: ${esc(x.location)}</div><div class="list-item">Incident date: ${esc(x.date)}</div><div class="list-item">Reporting officer: ${esc(x.officer)}</div></div>`)}${panel('Narrative',`<p style="white-space:pre-wrap;margin-top:12px">${esc(x.narrative||'No narrative provided.')}</p>`)}</div><div class="grid columns">${panel('Involved people',`<div class="list">${relatedPeople}</div>`,btn('link-person','Link person',`data-id="${esc(x.id)}"`))}${panel('Linked vehicles',`<div class="list">${relatedVehicles}</div>`)}${panel('Evidence',`<div class="list">${relatedEvidence.map(e=>`<div class="list-item">${link('evidence-detail',e.id,e.name)} <span class="muted small">${esc(e.id)}</span></div>`).join('')||'<p class="empty">No evidence linked.</p>'}</div>`,btn('new-evidence','Register item',`data-id="${esc(x.id)}"`))}${panel('Related cases',`<div class="list">${relatedCases.map(c=>`<div class="list-item">${link('case',c.id,c.title)} ${badge(c.status)}</div>`).join('')||'<p class="empty">No cases linked.</p>'}</div>`,btn('new-case','Create case',`data-id="${esc(x.id)}"`))}</div>${panel('Supplemental narratives',`<div class="list">${supplements}</div>`,btn('supplement','Add supplement',`data-id="${esc(x.id)}"`))}${panel('Review history',`<div class="list">${comments}</div>`)}<p class="small muted">Demo fields and checks are illustrative, not NIBRS validation or submission.</p></div>`
}
function cases(){return head('Cases and investigations','Manage assignments and follow-up work',btn('new-case','+ New case','',true))+panel('Case directory',table(['Case','Title','Status','Assigned to','Incidents'],db.cases.map(x=>`<tr><td>${link('case',x.id,x.id)}</td><td>${esc(x.title)}</td><td>${badge(x.status)}</td><td>${esc(x.assignee)}</td><td>${x.incidentIds.map(id=>link('incident',id,id)).join(', ')}</td></tr>`)))}
function caseDetail(){const x=find('cases',view.id);if(!x)return missing('cases');const linked=db.tasks.filter(t=>t.caseId===x.id);return head(x.id,x.title,btn('navigate','← Cases','data-page="cases"')+btn('edit-case','Edit case',`data-id="${esc(x.id)}"`))+`<div class="stack">${panel('Investigation',`<div class="list"><div class="list-item">Status: ${badge(x.status)}</div><div class="list-item">Assigned to: ${esc(x.assignee)}</div><div class="list-item">Linked incidents: ${x.incidentIds.map(id=>link('incident',id,id)).join(', ')||'None'}</div><div class="list-item">Notes: ${esc(x.notes||'None')}</div></div>`)}${panel('Follow-up tasks',taskTable(linked),btn('new-task','Add task',`data-id="${esc(x.id)}"`))}</div>`}
function people(){return head('Master person index','Roles are specific to each incident',btn('new-person','+ New person','',true))+panel('People',table(['Name','Demo ID','Date of birth','Aliases','Linked incidents'],db.people.map(p=>`<tr><td>${link('person',p.id,p.name)}</td><td>${esc(p.id)}</td><td>${esc(p.dob)}</td><td>${esc(p.aliases)}</td><td>${db.incidents.filter(i=>i.people.some(a=>a.id===p.id)).length}</td></tr>`)))}
function person(){const p=find('people',view.id);if(!p)return missing('people');const matches=db.incidents.flatMap(i=>i.people.filter(a=>a.id===p.id).map(a=>`<div class="list-item">${link('incident',i.id,i.id+' · '+i.type)} <span class="badge">${esc(a.role)}</span></div>`));const warrants=db.warrants.filter(w=>w.personId===p.id);return head(p.name,'Person profile · '+p.id,btn('navigate','← People','data-page="people"')+btn('edit-person','Edit profile',`data-id="${esc(p.id)}"`))+`<div class="grid columns">${panel('Profile',`<div class="list"><div class="list-item">Date of birth: ${esc(p.dob)}</div><div class="list-item">Aliases: ${esc(p.aliases)}</div><div class="list-item">${esc(p.description)}</div></div>`)}${panel('Incident involvement',`<div class="list">${matches.join('')||'<p class="empty">No linked incidents.</p>'}</div>`)}${panel('Listed warrants',`<div class="list">${warrants.map(w=>`<div class="list-item">${link('warrant',w.id,w.id+' · '+w.type)}</div>`).join('')||'<p class="empty">No linked demo warrants.</p>'}</div><p class="muted small">Demo information is not a warrant verification.</p>`)}</div>`}
function vehicles(){return head('Vehicles','Fictional vehicles linked to incidents',btn('new-vehicle','+ New vehicle','',true))+panel('Vehicle index',table(['ID','Description','Plate','Linked incidents'],db.vehicles.map(v=>`<tr><td>${link('vehicle',v.id,v.id)}</td><td>${esc(v.description)}</td><td>${esc(v.plate)}</td><td>${v.incidentIds.map(id=>link('incident',id,id)).join(', ')}</td></tr>`)))}
function vehicle(){const v=find('vehicles',view.id);if(!v)return missing('vehicles');return head(v.id,v.description,btn('navigate','← Vehicles','data-page="vehicles"'))+panel('Vehicle details',`<div class="list"><div class="list-item">Plate: ${esc(v.plate)}</div><div class="list-item">Linked incidents: ${v.incidentIds.map(id=>link('incident',id,id)).join(', ')||'None'}</div></div>`)}
function evidence(){return head('Property and evidence','Simulated inventory and custody history',btn('new-evidence','+ Register item','',true))+panel('Evidence inventory',table(['Item','Description','Incident','Custodian','Storage location'],db.evidence.map(e=>`<tr><td>${link('evidence-detail',e.id,e.id)}</td><td>${esc(e.name)}</td><td>${link('incident',e.incidentId,e.incidentId)}</td><td>${esc(e.custodian)}</td><td>${esc(e.location)}</td></tr>`)))}
function evidenceDetail(){const e=find('evidence',view.id);if(!e)return missing('evidence');return head(e.id,e.name,btn('navigate','← Evidence','data-page="evidence"')+btn('transfer','Record transfer',`data-id="${esc(e.id)}"`,true))+`<div class="stack">${panel('Item details',`<div class="list"><div class="list-item">Incident: ${link('incident',e.incidentId,e.incidentId)}</div><div class="list-item">Current custodian: ${esc(e.custodian)}</div><div class="list-item">Storage: ${esc(e.location)}</div></div>`)}${panel('Simulated custody history',table(['Date','From','To','Note'],e.history.map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.from)}</td><td>${esc(h.to)}</td><td>${esc(h.note)}</td></tr>`)))}</div>`}
function warrants(){return head('Warrants','Fictional demo records · not a verification source')+panel('Warrant directory',table(['Warrant','Person','Type','Issued','Status'],db.warrants.map(w=>`<tr><td>${link('warrant',w.id,w.id)}</td><td>${link('person',w.personId,label('people',w.personId))}</td><td>${esc(w.type)}</td><td>${esc(w.issued)}</td><td>${badge(w.status)}</td></tr>`)))}
function warrant(){const w=find('warrants',view.id);if(!w)return missing('warrants');return head(w.id,w.type,btn('navigate','← Warrants','data-page="warrants"')+btn('warrant-note','Add simulated check note',`data-id="${esc(w.id)}"`))+`<div class="stack">${panel('Warrant details',`<div class="list"><div class="list-item">Person: ${link('person',w.personId,label('people',w.personId))}</div><div class="list-item">Issued: ${esc(w.issued)}</div><div class="list-item">Status: ${badge(w.status)}</div><div class="list-item">${esc(w.note)}</div></div>`)}${panel('Simulated check notes',`<div class="list">${w.checks.map(c=>`<div class="list-item">${esc(c.text)}<div class="small muted">${esc(c.author)} · ${esc(stamp(c.at))}</div></div>`).join('')||'<p class="empty">No simulated notes recorded.</p>'}</div><p class="small muted">These notes do not verify a warrant or connect to an external system.</p>`)}</div>`}
function review(){const list=db.incidents.filter(x=>x.status==='Pending review');return head('Supervisor review queue','Switch to the Supervisor demo role to make a review decision')+panel('Reports awaiting review',table(['Incident','Offense','Officer','Actions'],list.map(x=>`<tr><td>${link('incident',x.id,x.id)}</td><td>${esc(x.type)}</td><td>${esc(x.officer)}</td><td>${role==='Supervisor'?btn('review-decision','Review',`data-id="${esc(x.id)}"`):'<span class="muted">Supervisor demo role required</span>'}</td></tr>`)))}
function taskTable(items){return table(['Task','Case','Assigned to','Due','Status','Action'],items.map(t=>`<tr><td>${esc(t.title)}</td><td>${t.caseId?link('case',t.caseId,t.caseId):'—'}</td><td>${esc(t.assignee)}</td><td>${esc(t.due||'—')}</td><td>${badge(t.status)} ${t.status==='Open'&&t.due&&t.due<today()?'<span class="badge danger">Overdue</span>':''}</td><td>${btn('toggle-task',t.status==='Open'?'Complete':'Reopen',`data-id="${esc(t.id)}"`)}</td></tr>`))}
function tasks(){return head('Tasks','Assignments and follow-ups',btn('new-task','+ New task','',true))+panel('Task list',taskTable(db.tasks))}
function analytics(){const allTypes=[...new Set(db.incidents.map(i=>i.type))];const f=reportFilters;const records=db.incidents.filter(i=>(!f.from||i.date>=f.from)&&(!f.to||i.date<=f.to)&&(!f.type||i.type===f.type)&&(!f.status||i.status===f.status));const types=[...new Set(records.map(i=>i.type))];const max=Math.max(1,...types.map(t=>records.filter(i=>i.type===t).length));return head('Reports and analytics',`${records.length} matching incidents · calculated from current demo records`,btn('print','Print summary'))+`<div class="stack"><form id="report-filters" class="card fields no-print">${field('from','From date',f.from,'date',false)}${field('to','To date',f.to,'date',false)}${selectField('type','Offense',opts(allTypes.map(t=>({id:t,text:t})),f.type,'All offenses'),false)}${selectField('status','Status',opts(['Draft','Returned','Pending review','Approved'].map(s=>({id:s,text:s})),f.status,'All statuses'),false)}<div class="actions"><button type="submit" class="primary">Apply filters</button><button type="button" class="secondary" data-action="clear-filters">Clear</button></div></form><p class="small muted">Filters: ${esc(f.from||'any date')} to ${esc(f.to||'any date')} · ${esc(f.type||'all offenses')} · ${esc(f.status||'all statuses')}</p><div class="grid columns">${panel('Incidents by offense',types.length?`<div class="list">${types.map(t=>{const n=records.filter(i=>i.type===t).length;return `<div class="list-item"><div class="row between"><span>${esc(t)}</span><strong>${n}</strong></div><div class="bar"><span style="width:${n/max*100}%"></span></div></div>`}).join('')}</div>`:'<p class="empty">No incidents match the filters.</p>')}${panel('Workflow summary',`<div class="list">${['Draft','Returned','Pending review','Approved'].map(s=>`<div class="list-item row between"><span>${badge(s)}</span><strong>${records.filter(i=>i.status===s).length}</strong></div>`).join('')}</div>`)}</div></div>`}
function audit(){return head('Audit history','Simulated application activity; not a tamper-resistant audit log')+panel('Activity',listEvents(db.audit))}
function settings(){return head('Demo settings','Data is stored only in this browser on this device')+`<div class="grid columns">${panel('Sample data',`<p class="muted" style="margin:12px 0">Reset replaces all current demo records with the original fictional scenario.</p>${btn('reset','Reset demo data')}`)}${panel('Data portability',`<p class="muted" style="margin:12px 0">Export or import a complete demo snapshot. Import replaces current records.</p><div class="actions">${btn('export','Export JSON')}${btn('import','Import JSON')}</div>`)}${panel('Limitations',`<p class="muted" style="margin-top:12px">Roles are visual workflow simulations, not security controls. Browser storage is not encrypted or suitable for real records. No external systems are connected.</p>`)}</div>`}
function search(){const q=view.query.trim().toLowerCase();const includes=(...v)=>v.some(x=>String(x??'').toLowerCase().includes(q));if(!q)return head('Global search','Enter a search term above.');const groups=[['Incidents',db.incidents.filter(x=>includes(x.id,x.type,x.location,x.narrative,x.officer)).map(x=>link('incident',x.id,x.id+' · '+x.type))],['People',db.people.filter(x=>includes(x.id,x.name,x.aliases,x.dob)).map(x=>link('person',x.id,x.name+' · '+x.id))],['Vehicles',db.vehicles.filter(x=>includes(x.id,x.description,x.plate)).map(x=>link('vehicle',x.id,x.description+' · '+x.plate))],['Evidence',db.evidence.filter(x=>includes(x.id,x.name,x.location,x.custodian)).map(x=>link('evidence-detail',x.id,x.id+' · '+x.name))],['Warrants',db.warrants.filter(x=>includes(x.id,x.type,x.status,label('people',x.personId))).map(x=>link('warrant',x.id,x.id+' · '+label('people',x.personId)))],['Cases',db.cases.filter(x=>includes(x.id,x.title,x.assignee,x.notes)).map(x=>link('case',x.id,x.id+' · '+x.title))]];return head('Search results','Results for “'+view.query+'”')+`<div class="grid columns">${groups.map(([name,items])=>panel(name,`<div class="list">${items.map(item=>`<div class="list-item">${item}</div>`).join('')||'<p class="empty">No matches.</p>'}</div>`)).join('')}</div>`}
function missing(page){return head('Record not found','The record may have been removed or replaced.',btn('navigate','Back',`data-page="${esc(page)}"`))}
function openDialog(title,body,submitLabel,onSubmit){$('dialog').innerHTML=`<form id="dialog-form"><div class="row between"><h2 id="modal-title">${esc(title)}</h2><button type="button" class="secondary" data-action="close-modal" aria-label="Close dialog">×</button></div>${body}<div class="actions"><button type="submit" class="primary">${esc(submitLabel)}</button><button type="button" class="secondary" data-action="close-modal">Cancel</button></div></form>`;$('modal').hidden=false;$('dialog-form').addEventListener('submit',e=>{e.preventDefault();onSubmit(new FormData(e.currentTarget))});$('dialog').querySelector('input,select,textarea,button').focus()}
function closeDialog(){$('modal').hidden=true;$('dialog').innerHTML=''}
function field(name,title,value='',type='text',required=true){return `<label>${esc(title)}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`}
function selectField(name,title,options,required=true){return `<label>${esc(title)}<select name="${esc(name)}" ${required?'required':''}>${options}</select></label>`}
function textField(name,title,value='',required=true){return `<label class="wide">${esc(title)}<textarea name="${esc(name)}" ${required?'required':''}>${esc(value)}</textarea></label>`}
function done(message,page,id){closeDialog();if(persist()){show(page,id);flash(message)}}
function incidentForm(id){const x=id?find('incidents',id):null;if(id&&(!x||!['Draft','Returned'].includes(x.status))){flash('Only draft or returned incidents can be edited.',true);return}const types=['Burglary / Breaking & Entering','Simple Assault','Motor Vehicle Theft','Vandalism / Damage of Property','Other'];openDialog(x?'Edit incident':'New incident',`<div class="fields">${selectField('type','Offense classification',opts(types.map(t=>({id:t,text:t})),x?.type))}${field('date','Incident date',x?.date||today(),'date')}${field('location','Location',x?.location||'')}${field('officer','Reporting officer',x?.officer||actor())}${textField('narrative','Narrative',x?.narrative||'',false)}</div><p class="small muted">Basic demo field checks only; no NIBRS validation or submission.</p>`,'Save draft',f=>{const data={type:f.get('type').trim(),date:f.get('date'),location:f.get('location').trim(),officer:f.get('officer').trim(),narrative:f.get('narrative').trim()};if(!data.type||!data.location||!data.officer){flash('Complete the required fields.',true);return}let target;if(x){Object.assign(x,data);target=x.id;record('Updated incident '+target)}else{target=nextId('INC-DEMO-',db.incidents);db.incidents.unshift({id:target,...data,status:'Draft',people:[],vehicles:[],supplements:[],reviewComments:[]});record('Created incident '+target)}done('Incident draft saved.','incident',target)})}
function linkPerson(id){const incident=find('incidents',id);openDialog('Link person',`<div class="fields">${selectField('person','Person',opts(db.people.map(p=>({id:p.id,text:p.name}))))}${selectField('role','Role in this incident',opts(['Victim','Witness','Reporting party','Suspect','Person of interest','Other'].map(r=>({id:r,text:r}))))}</div>`,'Link person',f=>{const person=f.get('person'),r=f.get('role');if(incident.people.some(p=>p.id===person&&p.role===r)){flash('That person already has this role on the incident.',true);return}incident.people.push({id:person,role:r});record('Linked person '+person+' to '+id+' as '+r);done('Person linked.','incident',id)})}
function personForm(id){const p=id?find('people',id):null;openDialog(p?'Edit person':'New person',`<div class="fields">${field('name','Name',p?.name||'')}${field('dob','Date of birth',p?.dob||'','date',false)}${field('aliases','Aliases',p?.aliases||'', 'text',false)}${field('description','Description',p?.description||'','text',false)}</div>`,'Save person',f=>{const name=f.get('name').trim();if(!name){flash('Enter a name.',true);return}const data={name,dob:f.get('dob'),aliases:f.get('aliases').trim(),description:f.get('description').trim()};const target=p?p.id:nextId('P-DEMO-',db.people);if(p)Object.assign(p,data);else db.people.push({id:target,...data});record((p?'Updated ':'Created ')+'person '+target);done('Person saved.','person',target)})}
function vehicleForm(){openDialog('New vehicle',`<div class="fields">${field('description','Vehicle description')}${field('plate','Plate')}${selectField('incident','Linked incident',opts(db.incidents.map(i=>({id:i.id,text:i.id+' · '+i.type}))),false)}</div>`,'Save vehicle',f=>{const description=f.get('description').trim(),plate=f.get('plate').trim();if(!description||!plate){flash('Complete the required fields.',true);return}const id=nextId('V-DEMO-',db.vehicles),incident=f.get('incident');db.vehicles.push({id,description,plate,incidentIds:incident?[incident]:[]});if(incident)find('incidents',incident).vehicles.push(id);record('Created vehicle '+id);done('Vehicle saved.','vehicle',id)})}
function supplement(id){openDialog('Add supplemental narrative',`<div class="fields">${textField('text','Supplement')}</div>`,'Add supplement',f=>{const text=f.get('text').trim();if(!text){flash('Enter a supplement.',true);return}find('incidents',id).supplements.push({text,author:actor(),at:new Date().toISOString()});record('Added supplement to '+id);done('Supplement added.','incident',id)})}
function caseForm(id,incidentId){const c=id?find('cases',id):null;openDialog(c?'Edit case':'Create case',`<div class="fields">${field('title','Case title',c?.title||'')}${field('assignee','Assigned to',c?.assignee||'Detective A. Chen')}${selectField('status','Status',opts(['Open','Closed'].map(s=>({id:s,text:s})),c?.status||'Open'))}${selectField('incident','Linked incident',opts(db.incidents.map(i=>({id:i.id,text:i.id+' · '+i.type})),c?.incidentIds[0]||incidentId),false)}${textField('notes','Investigation notes',c?.notes||'',false)}</div>`,'Save case',f=>{const title=f.get('title').trim(),assignee=f.get('assignee').trim();if(!title||!assignee){flash('Complete the required fields.',true);return}const linked=f.get('incident');const values={title,assignee,status:f.get('status'),notes:f.get('notes').trim()};let target;if(c){Object.assign(c,values);if(linked&&!c.incidentIds.includes(linked))c.incidentIds.push(linked);target=c.id}else{target=nextId('CASE-DEMO-',db.cases);db.cases.unshift({id:target,...values,incidentIds:linked?[linked]:[]})}record((c?'Updated ':'Created ')+'case '+target);done('Case saved.','case',target)})}
function evidenceForm(incidentId){openDialog('Register evidence',`<div class="fields">${field('name','Item description')}${selectField('incident','Linked incident',opts(db.incidents.map(i=>({id:i.id,text:i.id+' · '+i.type})),incidentId))}${field('custodian','Initial custodian',actor())}${field('location','Storage location')}</div>`,'Register item',f=>{const name=f.get('name').trim(),custodian=f.get('custodian').trim(),location=f.get('location').trim();if(!name||!custodian||!location){flash('Complete the required fields.',true);return}const id=nextId('E-DEMO-',db.evidence);db.evidence.unshift({id,name,incidentId:f.get('incident'),custodian,location,history:[{date:today(),from:'Collected',to:custodian,note:'Initial simulated intake'}]});record('Registered evidence '+id);done('Evidence registered.','evidence-detail',id)})}
function transfer(id){const e=find('evidence',id);openDialog('Record custody transfer',`<p class="muted">Current custodian: ${esc(e.custodian)}</p><div class="fields">${field('to','New custodian')}${field('location','New storage location',e.location)}${textField('note','Transfer note','',false)}</div>`,'Record transfer',f=>{const to=f.get('to').trim(),location=f.get('location').trim();if(!to||!location){flash('Complete the required fields.',true);return}e.history.push({date:today(),from:e.custodian,to,note:f.get('note').trim()});e.custodian=to;e.location=location;record('Recorded simulated custody transfer for '+id);done('Transfer recorded.','evidence-detail',id)})}
function taskForm(caseId){openDialog('Create task',`<div class="fields">${field('title','Task')}${field('assignee','Assigned to',actor())}${field('due','Due date','','date',false)}${selectField('case','Linked case',opts(db.cases.map(c=>({id:c.id,text:c.id+' · '+c.title})),caseId),false)}</div>`,'Create task',f=>{const title=f.get('title').trim(),assignee=f.get('assignee').trim();if(!title||!assignee){flash('Complete the required fields.',true);return}const id=nextId('T-DEMO-',db.tasks);db.tasks.unshift({id,title,assignee,due:f.get('due'),caseId:f.get('case'),status:'Open'});record('Created task '+id);done('Task created.',caseId?'case':'tasks',caseId||null)})}
function reviewForm(id){const i=find('incidents',id);if(role!=='Supervisor'||!i||i.status!=='Pending review'){flash('A pending report and Supervisor demo role are required.',true);return}openDialog('Review '+id,`<div class="fields">${selectField('decision','Decision',opts([{id:'Approved',text:'Approve'},{id:'Returned',text:'Return for revision'}]))}${textField('text','Review comment')}</div>`,'Save decision',f=>{if(role!=='Supervisor'||i.status!=='Pending review'){flash('This report is no longer available for review.',true);return}const text=f.get('text').trim();if(!text){flash('Enter a review comment.',true);return}i.status=f.get('decision');i.reviewComments.push({decision:i.status,text,author:actor(),at:new Date().toISOString()});record(i.status+' incident '+id);done('Review decision recorded.','incident',id)})}
function warrantNote(id){openDialog('Add simulated check note',`<p class="muted">This records a demo note only. It does not verify the warrant.</p><div class="fields">${textField('text','Note')}</div>`,'Save note',f=>{const text=f.get('text').trim();if(!text){flash('Enter a note.',true);return}find('warrants',id).checks.push({text,author:actor(),at:new Date().toISOString()});record('Added simulated warrant note to '+id);done('Demo note saved.','warrant',id)})}
function validSnapshot(data){
 const object=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const str=(x,keys)=>object(x)&&keys.every(k=>typeof x[k]==='string');
 const ids=x=>Array.isArray(x)&&x.every(v=>typeof v==='string');
 const arrays=['incidents','people','vehicles','cases','evidence','warrants','tasks','audit'];
 if(!object(data)||data.version!==1||!arrays.every(k=>Array.isArray(data[k])))return false;
 if(!data.incidents.every(x=>str(x,['id','type','location','date','officer','status','narrative'])&&['Draft','Returned','Pending review','Approved'].includes(x.status)&&Array.isArray(x.people)&&x.people.every(p=>str(p,['id','role']))&&ids(x.vehicles)&&Array.isArray(x.supplements)&&x.supplements.every(s=>str(s,['text','author','at']))&&Array.isArray(x.reviewComments)&&x.reviewComments.every(c=>str(c,['decision','text','author','at']))))return false;
 if(!data.people.every(x=>str(x,['id','name','dob','aliases','description']))||!data.vehicles.every(x=>str(x,['id','description','plate'])&&ids(x.incidentIds))||!data.cases.every(x=>str(x,['id','title','assignee','status','notes'])&&['Open','Closed'].includes(x.status)&&ids(x.incidentIds)))return false;
 if(!data.evidence.every(x=>str(x,['id','name','incidentId','location','custodian'])&&Array.isArray(x.history)&&x.history.every(h=>str(h,['date','from','to','note'])))||!data.warrants.every(x=>str(x,['id','personId','type','status','issued','note'])&&Array.isArray(x.checks)&&x.checks.every(c=>str(c,['text','author','at']))))return false;
 if(!data.tasks.every(x=>str(x,['id','title','caseId','assignee','due','status'])&&['Open','Completed'].includes(x.status))||!data.audit.every(x=>str(x,['at','actor','action'])))return false;
 for(const key of arrays.filter(x=>x!=='audit'))if(new Set(data[key].map(x=>x.id)).size!==data[key].length)return false;
 const has=(key,id)=>data[key].some(x=>x.id===id);
 return data.incidents.every(x=>x.people.every(p=>has('people',p.id))&&x.vehicles.every(id=>has('vehicles',id)))&&data.vehicles.every(x=>x.incidentIds.every(id=>has('incidents',id)))&&data.cases.every(x=>x.incidentIds.every(id=>has('incidents',id)))&&data.evidence.every(x=>has('incidents',x.incidentId))&&data.warrants.every(x=>has('people',x.personId))&&data.tasks.every(x=>!x.caseId||has('cases',x.caseId));
}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw){db=copy(initialData);persist();return}const parsed=JSON.parse(raw);if(!validSnapshot(parsed))throw new Error('Stored data is invalid');db=parsed}catch(error){db=copy(initialData);flash('Could not load stored demo data: '+error.message+'. Sample data is shown without replacing storage.',true)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='navigate')show(b.dataset.page);else if(a==='open')show(b.dataset.page,id);else if(a==='search')show('search',null,$('search').value);else if(a==='close-modal')closeDialog();else if(a==='print')window.print();else if(a==='new-incident')incidentForm();else if(a==='edit-incident')incidentForm(id);else if(a==='new-person')personForm();else if(a==='edit-person')personForm(id);else if(a==='new-vehicle')vehicleForm();else if(a==='link-person')linkPerson(id);else if(a==='supplement')supplement(id);else if(a==='new-case')caseForm(null,id);else if(a==='edit-case')caseForm(id);else if(a==='new-evidence')evidenceForm(id);else if(a==='transfer')transfer(id);else if(a==='new-task')taskForm(id);else if(a==='review-decision')reviewForm(id);else if(a==='warrant-note')warrantNote(id);else if(a==='clear-filters'){reportFilters={from:'',to:'',type:'',status:''};render()}
 else if(a==='submit-incident'){const x=find('incidents',id);if(!x||!['Draft','Returned'].includes(x.status)){flash('Only draft or returned reports can be submitted.',true);return}x.status='Pending review';record('Submitted incident '+id+' for review');if(persist()){show('incident',id);flash('Submitted to the simulated review queue.')}}
 else if(a==='toggle-task'){const t=find('tasks',id);t.status=t.status==='Open'?'Completed':'Open';record('Marked task '+id+' '+t.status.toLowerCase());if(persist()){render();flash('Task updated.')}}
 else if(a==='reset'){if(confirm('Replace all demo records with the original fictional sample data?')){db=copy(initialData);if(persist()){show('dashboard');flash('Demo data reset.')}}}
 else if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='arachne-rms-demo.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 else if(a==='import')$('import-file').click();
});
$('role').addEventListener('change',e=>{role=e.target.value;render();flash('Demo role changed to '+role+'. This is not authentication.')});
document.addEventListener('submit',e=>{if(e.target.id!=='report-filters')return;e.preventDefault();const f=new FormData(e.target);if(f.get('from')&&f.get('to')&&f.get('from')>f.get('to')){flash('The start date must not be after the end date.',true);return}reportFilters={from:f.get('from'),to:f.get('to'),type:f.get('type'),status:f.get('status')};render()});
$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();show('search',null,e.target.value)}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeDialog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeDialog()});
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const parsed=JSON.parse(await file.text());if(!validSnapshot(parsed))throw new Error('Invalid or incompatible demo snapshot');if(!confirm('Replace all current demo records with this snapshot?'))return;db=parsed;if(persist()){show('dashboard');flash('Demo snapshot imported.')}}catch(error){flash('Import failed: '+error.message,true)}});
load();render();
</script>
</body>
</html>
