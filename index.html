<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arachne RMS | Interactive demo</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2f;--border:#29374d;--text:#e5edf8;--muted:#a9bad0;--blue:#69a8ff;--green:#62d7a2;--amber:#f5c46e;--red:#ff9292}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #7eb7ff;outline-offset:2px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{background:#080f1c;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{font-weight:800;font-size:19px;letter-spacing:.04em;color:#82b5ff}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:0}.nav{display:grid;gap:4px}.nav button{text-align:left;background:transparent;border:0;color:var(--muted);padding:10px 12px;border-radius:7px}.nav button:hover,.nav button.active{background:#1b355e;color:white}.sidebar-bottom{margin-top:auto;color:var(--muted);font-size:12px}.main{min-width:0}.topbar{background:#0b1424;border-bottom:1px solid var(--border);padding:13px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.topbar input{max-width:480px;flex:1 1 240px}.content{max-width:1500px;margin:auto;padding:24px}.notice{background:#3a2a12;border:1px solid #735223;color:#ffdd9c;border-radius:8px;padding:10px 14px;margin-bottom:20px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:19px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.stack{display:grid;gap:16px}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.columns{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;min-width:0}.metric strong{display:block;font-size:28px;color:var(--blue)}.metric button{background:none;border:0;padding:0;text-align:left;color:inherit;width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button,button.primary,button.secondary,button.danger{border:1px solid var(--border);background:#253851;color:var(--text);border-radius:6px;padding:8px 12px}.button:hover,button.secondary:hover{background:#324a69}button.primary{background:#2563bc;border-color:#3376d8;color:white}button.primary:hover{background:#3479d2}button.danger{background:#45242a;border-color:#74404b}button.link{border:0;background:none;color:var(--blue);padding:0;text-align:left}button.link:hover{text-decoration:underline}button:disabled{opacity:.5;cursor:not-allowed}.badge{display:inline-block;background:#233b5d;color:#b9d8ff;border:1px solid #36567a;border-radius:999px;padding:2px 8px;font-size:11px;white-space:nowrap}.badge.ok{background:#143c32;color:#9be5c2;border-color:#2b6655}.badge.warn{background:#483718;color:#f7d79a;border-color:#715a2c}.badge.danger{background:#4b252a;color:#ffb6b6;border-color:#74434a}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}input,select,textarea{background:#091323;color:var(--text);border:1px solid #40516a;border-radius:6px;padding:8px 10px;width:100%}textarea{resize:vertical;min-height:85px}label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:600}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.fields .wide{grid-column:1/-1}.empty{padding:24px;text-align:center;color:var(--muted)}.list{display:grid;gap:0}.list-item{padding:11px 0;border-bottom:1px solid var(--border)}.list-item:last-child{border-bottom:0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.timeline{border-left:2px solid #375274;margin-left:5px;padding-left:17px}.timeline .list-item{position:relative}.timeline .list-item:before{content:"";position:absolute;left:-23px;top:17px;background:#7db4ff;border:2px solid var(--panel);border-radius:50%;width:9px;height:9px}.dialog-backdrop{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.dialog-backdrop[hidden]{display:none}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#111c2f;border:1px solid #40516a;border-radius:10px;box-shadow:0 12px 50px #0009;padding:22px}.dialog form{display:grid;gap:16px}.dialog h2{margin-bottom:4px}.toast{position:fixed;right:20px;bottom:20px;background:#193b31;color:#c5f8dc;border:1px solid #376f5b;border-radius:7px;padding:11px 16px;z-index:10;max-width:400px}.toast.error{background:#51262c;color:#ffd9d9;border-color:#88444e}.bar{height:8px;background:#23364e;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#609ff5}.print-only{display:none}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidebar-bottom{display:none}.content{padding:16px}.topbar{padding:12px 16px}}
@media print{body{background:white;color:black}.sidebar,.topbar,.notice,.no-print,.toast{display:none!important}.layout{display:block}.content{max-width:none;padding:0}.card{background:white;border:1px solid #bbb;break-inside:avoid}.muted{color:#444}.badge{color:black;background:white;border-color:#888}.print-only{display:block}}
.brand img{display:block;width:100%;max-width:202px;height:auto;border-radius:8px}
.nav button.subnav{padding-left:28px;font-size:13px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><img src="images/logo.png" alt="Arachne Police"></div>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom">Fictional data only<br>Local browser storage &middot; Demo mode</div>
  </aside>
  <main class="main">
    <header class="topbar no-print">
      <input id="search" type="search" placeholder="Search incidents, cases, arrests, people, vehicles..." aria-label="Global search">
      <button class="secondary" data-action="search">Search</button>
      <label class="row">Demo role <select id="role" aria-label="Demo role"><option>Officer</option><option>Detective</option><option>Supervisor</option><option>Administrator</option></select></label>
      <button class="primary" data-action="new-incident">+ New incident</button>
    </header>
    <div class="content">
      <div class="notice no-print"><strong>SIMULATION ONLY.</strong> Fictional records. No real authentication, warrant verification, NIBRS submission, or CJIS compliance. Do not enter real sensitive data.</div>
      <div id="app"></div>
    </div>
  </main>
</div>
<div class="dialog-backdrop" id="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="dialog"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
// Keep the original key so existing demo records survive the rename.
const KEY = 'apex_rms_interactive_demo_v1';
const navItems = [['dashboard','Dashboard'],['workload','My work'],['daily','Daily attention'],['incidents','Incidents'],['cases','Cases'],['arrests','Arrests'],['people','People'],['vehicles','Vehicles'],['evidence','Evidence'],['warrants','Warrants'],['review','Review queue'],['tasks','Tasks'],['analytics','Analytics'],['audit','Audit history'],['settings','Demo settings']];
const initialData = {
  version: 1,
  incidents: [
    {id:'INC-2026-891',type:'Burglary / Breaking & Entering',location:'1042 Market St.',date:'2026-10-28',officer:'Officer J. Miller',status:'Draft',narrative:'Fictional scenario: a shop owner reported a broken rear door and missing equipment. A witness described a vehicle leaving the area.',people:[{id:'P-001',role:'Victim'},{id:'P-002',role:'Witness'},{id:'P-003',role:'Person of interest'}],vehicles:['V-001'],supplements:[],reviewComments:[]},
    {id:'INC-2026-890',type:'Motor Vehicle Theft',location:'405 Pine Street',date:'2026-10-25',officer:'Officer S. Briggs',status:'Approved',narrative:'Fictional scenario: a vehicle was reported missing from a residential parking area.',people:[{id:'P-002',role:'Reporting party'}],vehicles:[],supplements:[],reviewComments:[]}
  ],

    {id:'P-002',name:'Jordan Ellis',dob:'1992-11-02',aliases:'None listed',description:'Local resident'},
    {id:'P-003',name:'Casey Morgan',dob:'1988-03-19',aliases:'C. Morgan',description:'Fictional person of interest'}
  ],

  cases:[{id:'CASE-2026-041',title:'Market Street burglary',incidentIds:['INC-2026-891'],assignee:'Detective A. Chen',status:'Open',notes:'Review footage and follow up with the witness.'}],

  warrants:[{id:'W-0421',personId:'P-003',type:'Bench warrant',status:'Listed in demo',issued:'2026-10-12',note:'Fictional record. Status and identity have not been verified.',checks:[]}],
  tasks:[{id:'T-001',title:'Follow up with witness',caseId:'CASE-2026-041',assignee:'Detective A. Chen',due:'2026-11-12',status:'Open'}],
  audit:[{at:'2026-10-28T15:00:00',actor:'Officer J. Miller',action:'Created fictional incident INC-2026-891'}]
};
let db;
let view = {page:'dashboard',id:null,query:''};
let role = 'Officer';
let dailyDate;
let reportFilters = {from:'',to:'',type:'',status:''};
let toastTimer;
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy = value => JSON.parse(JSON.stringify(value));
const find = (collection,id) => db[collection].find(item => item.id === id);
const label = (collection,id,field='name') => find(collection,id)?.[field] || id;
const today = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
dailyDate = today();
const actor = () => ({Officer:'Officer J. Miller',Detective:'Detective A. Chen',Supervisor:'Supervisor R. Patel',Administrator:'Administrator'})[role];
const demoPeople = ['Officer J. Miller','Detective A. Chen','Supervisor R. Patel','Administrator'];
const assigneeOptions = (selected='') => opts([...new Set([...demoPeople,...(selected?[selected]:[])])].map(id=>({id,text:id})),selected,'Unassigned');
const canViewInvestigation = c => c.access!=='Restricted'||role==='Supervisor'||role==='Administrator'||(c.accessUsers||[]).includes(actor());
const reportSections = {
 case: [
  {id:'header',title:'Report and occurrence',fields:[['agency','Agency'],['division','Division / precinct'],['ori','ORI'],['reportType','Original / supplement'],['reported','Date and time reported','datetime-local'],['occurredFrom','Occurred from','datetime-local'],['occurredTo','Occurred to','datetime-local'],['incidentType','Incident type'],['business','Business name'],['weapons','Weapons'],['address','Incident address'],['cityStateZip','City, state, ZIP'],['locationCode','Location code'],['victimCount','Number of victims','number'],['suspectCount','Number of suspects','number'],['victimAlsoComplainant','Victim also complainant']]},
  {id:'offenses',title:'Offenses',multiple:true,fields:[['number','Offense number'],['law','Law'],['section','Section'],['subsection','Subdivision'],['class','Class'],['category','Category'],['degree','Degree'],['attempted','Attempted'],['name','Name of offense'],['counts','Counts','number'],['tsled','T/SLED code']]},
  {id:'persons',title:'Associated persons and subjects',multiple:true,fields:[['person','Linked demo person','person'],['type','Person type / number'],['name','Name if not linked'],['alias','Alias / nickname'],['dob','Date of birth if not linked','date'],['age','Age','number'],['sex','Sex'],['race','Race'],['ethnicity','Ethnicity'],['address','Address'],['phone','Phone'],['condition','Apparent condition'],['residence','Residence status'],['handicap','Handicap'],['victimRights','Victim rights information provided'],['skin','Skin'],['height','Height'],['weight','Weight'],['hair','Hair'],['eyes','Eyes'],['glasses','Glasses / contacts'],['build','Build'],['occupation','Occupation'],['employer','Employer / school'],['employerAddress','Employer / school address'],['marks','Scars / marks / tattoos'],['misc','Miscellaneous']]},
  {id:'property',title:'Case report property',multiple:true,fields:[['personNumber','Victim / suspect number'],['status','Property status'],['type','Property type'],['quantity','Quantity / measure'],['make','Make / drug type'],['model','Model'],['serial','Serial number'],['description','Description'],['value','Value']]},
  {id:'vehicles',title:'Case report vehicles',multiple:true,fields:[['status','Vehicle status'],['plate','License plate'],['plateCompleteness','Full / partial plate'],['state','Plate state'],['expiry','Plate expiration year'],['plateType','Plate type'],['value','Value'],['year','Vehicle year'],['make','Make'],['model','Model'],['style','Style'],['vin','VIN'],['colors','Colors'],['towedBy','Towed by'],['towedTo','Towed to'],['notes','Vehicle notes','textarea']]},
  {id:'narrative',title:'Case narrative',fields:[['text','Narrative','textarea']]},
  {id:'administration',title:'Case administration',fields:[['inquiries','Inquiries'],['nyspin','NYSPIN message number'],['reportingOfficer','Reporting officer name / rank'],['officerId','Reporting officer ID'],['supervisor','Supervisor name / rank'],['supervisorId','Supervisor ID'],['closureReason','Closure reason'],['statusDate','Status date','date'],['notified','Notified / transferred to']]},
 ],
 arrest: [
  {id:'identifiers',title:'Report identifiers',fields:[['nysid','NYSID number'],['obts','OBTS number'],['reference','Reference number'],['fbi','FBI number'],['agency','Agency'],['division','Division / precinct']]},
  {id:'defendant',title:'Defendant details',fields:[['phone','Phone'],['address','Street address'],['cityStateZip','City, state, ZIP'],['residence','Residence status'],['birthPlace','Place of birth'],['age','Age','number'],['sex','Sex'],['race','Race'],['ethnicity','Ethnicity'],['skin','Skin'],['height','Height'],['weight','Weight'],['hair','Hair'],['eyes','Eyes'],['glasses','Glasses / contacts'],['build','Build'],['marital','Marital status'],['citizenship','U.S. citizenship'],['citizenOf','Citizen of'],['education','Education'],['religion','Religion'],['occupation','Occupation'],['employed','Employed'],['marks','Scars / marks / tattoos']]},
  {id:'circumstances',title:'Arrest circumstances',fields:[['officerId','Arresting officer ID'],['assistingOfficer','Assisting officer'],['assistingId','Assisting officer ID'],['arrestTime','Arrest time','time'],['juvenile','Juvenile / no further processing'],['condition','Condition at arrest'],['weapons','Weapons at arrest'],['codefendant','Co-defendant arrest number'],['miranda','Miranda given'],['mirandaBy','Miranda by'],['mirandaDate','Miranda date','date'],['mirandaTime','Miranda time','time'],['statements','Statements'],['status','Bail / parole / probation status'],['searchWarrant','Search warrant'],['idProcedure','Identification procedure'],['property','Property'],['evidence','Evidence'],['processedBy','Processed by'],['disposition','Disposition'],['arrestType','Arrest type'],['warrantNumber','Warrant number'],['arrestFoa','Arrest FOA'],['otherAgency','Other agency'],['fingerprints','Fingerprints taken'],['photoNumber','Photo number'],['safis','SAFIS latent print identification']]},
  {id:'court',title:'Arraignment, custody and return',fields:[['arraignmentCourt','Arraignment court'],['arraignmentJudge','Arraignment judge'],['arraignmentDate','Arraignment date','date'],['arraignmentTime','Arraignment time','time'],['arresteeStatus','Arrestee / release status'],['bailAmount','Bail amount'],['bondsman','Bondsman'],['returnCourt','Return court'],['returnJudge','Return judge'],['returnDate','Return date','date'],['returnTime','Return time','time'],['totAgency','Defendant / case transferred to agency'],['totOfficer','Receiving officer'],['totOfficerId','Receiving officer ID'],['totDate','Transfer date','date'],['totTime','Transfer time','time']]},
  {id:'offenseDetails',title:'Offense context',fields:[['location','Location of offense'],['date','Offense date','date'],['offenderCount','Number of offenders','number'],['victimCount','Number of victims','number']]},
  {id:'charges',title:'Charges',multiple:true,fields:[['law','Law'],['section','Article / section'],['subsection','Subdivision'],['class','Class'],['category','Category'],['degree','Degree'],['attempted','Attempted'],['name','Name of offense'],['counts','Counts','number'],['ncic','NCIC code'],['victimAge','Victim age'],['victimSex','Victim sex'],['victimHandicap','Victim handicap'],['associationNumber','Association number'],['type','Charge document type']]},
  {id:'persons',title:'Associated persons',multiple:true,fields:[['person','Linked demo person','person'],['type','Person type'],['name','Name if not linked'],['address','Address'],['phone','Phone']]},
  {id:'narrative',title:'Arrest narrative',fields:[['text','Narrative','textarea']]},
  {id:'administration',title:'Arrest administration',fields:[['arrestingOfficer','Arresting officer name'],['officerId','Officer ID'],['supervisor','Supervisor name'],['supervisorId','Supervisor ID']]},
 ]
};
const attachmentCategories = ['Other','Narrative','Follow-up','Statement','Deposition','Court document','Photograph'];
const maxAttachmentBytes = 512*1024;
const maxTotalAttachmentBytes = 1024*1024;
const incidentSummary = id => {
 const i=find('incidents',id);if(!i)return '';
 const people=i.people.map(p=>`${link('person',p.id,label('people',p.id))} (${esc(p.role)})`).join(', ')||'None';
 const vehicles=i.vehicles.map(v=>link('vehicle',v,label('vehicles',v,'description'))).join(', ')||'None';
 const property=db.evidence.filter(e=>e.incidentId===id).map(e=>link('evidence-detail',e.id,e.name)).join(', ')||'None';
 return panel(id+' · '+i.type,`<div class="list"><div class="list-item">${link('incident',id,'Open incident')} · ${esc(i.date)} · ${esc(i.location)}</div><div class="list-item">Reporting officer: ${esc(i.officer)}</div><div class="list-item">People: ${people}</div><div class="list-item">Vehicles: ${vehicles}</div><div class="list-item">Property/evidence: ${property}</div><div class="list-item" style="white-space:pre-wrap">Narrative: ${esc(i.narrative||'None')}</div><div class="list-item">Supplements: ${i.supplements.map(s=>esc(s.text)).join('; ')||'None'}</div></div>`);
};
const stamp = value => { const d = new Date(value); return Number.isNaN(d.getTime()) ? value : d.toLocaleString(); };
const badge = value => `<span class="badge ${['Approved','Completed','Closed'].includes(value)?'ok':['Returned','Pending review','Open'].includes(value)?'warn':''}">${esc(value)}</span>`;
const link = (page,id,text) => `<button class="link" data-action="open" data-page="${esc(page)}" data-id="${esc(id)}">${esc(text)}</button>`;
function flash(message,error=false){const node=$('toast');node.textContent=message;node.className='toast'+(error?' error':'');node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,5000)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(error){flash('Could not save to browser storage: '+error.message,true);return false}}
function record(action){db.audit.unshift({at:new Date().toISOString(),actor:actor(),action})}
function nextId(prefix,records){let n=1;while(records.some(x=>x.id===prefix+String(n).padStart(3,'0')))n++;return prefix+String(n).padStart(3,'0')}
function head(title,subtitle='',actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p class="muted">${esc(subtitle)}</p></div><div class="actions no-print">${actions}</div></div>`}
function btn(action,text,extra='',primary=false){return `<button class="${primary?'primary':'secondary'}" data-action="${action}" ${extra}>${esc(text)}</button>`}
function panel(title,content,actions=''){return `<section class="card"><div class="row between"><h2>${esc(title)}</h2><div class="actions no-print">${actions}</div></div>${content}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No records to display.</td></tr>`}</tbody></table></div>`}
function opts(items,selected='',placeholder='Select...'){return `<option value="">${esc(placeholder)}</option>`+items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.text)}</option>`).join('')}
function show(page,id=null,query=''){view={page,id,query};render();window.scrollTo(0,0)}
function renderNav(){$('nav').innerHTML=navItems.map(([id,text])=>`<button data-action="navigate" data-page="${id}" class="${id==='arrests'?'subnav ':''}${view.page===id||(id==='arrests'&&view.page==='arrest')?'active':''}" ${view.page===id||(id==='arrests'&&view.page==='arrest')?'aria-current="page"':''}>${esc(text)}</button>`).join('')}
function render(){renderNav();const pages={dashboard,workload,daily,incidents,incident,cases,case:caseDetail,arrests,arrest,people,person,vehicles,vehicle,evidence,'evidence-detail':evidenceDetail,warrants,warrant,review,tasks,analytics,audit,settings,search};$('app').innerHTML=pages[view.page]();$('role').value=role}
function listEvents(items){return items.length?`<div class="list timeline">${items.map(x=>`<div class="list-item"><div>${esc(x.action)}</div><div class="muted small">${esc(x.actor)} &middot; ${esc(stamp(x.at))}</div></div>`).join('')}</div>`:'<p class="empty">No activity yet.</p>'}
function dashboard(){
 const metrics=[['Incidents',db.incidents.length,'incidents'],['Open cases',db.cases.filter(x=>x.status==='Open').length,'cases'],['Arrests',db.arrests.length,'arrests'],['Awaiting review',db.incidents.filter(x=>x.status==='Pending review').length,'review'],['Open tasks',db.tasks.filter(x=>x.status==='Open').length,'tasks'],['Evidence items',db.evidence.length,'evidence'],['Listed warrants',db.warrants.length,'warrants']];
 return head('Dashboard','A connected, fictional RMS workflow')+`<div class="stack"><div class="grid metrics">${metrics.map(([name,count,page])=>`<div class="card metric"><button data-action="navigate" data-page="${page}"><span class="muted">${name}</span><strong>${count}</strong><span class="small">View records &rarr;</span></button></div>`).join('')}</div><div class="grid columns">${panel('Start the sample scenario',`<p class="muted" style="margin:10px 0">Follow the Market Street burglary from incident through evidence, review and investigation.</p>${link('incident','INC-2026-891','Open sample incident →')}`)}${panel('Recent demo activity',listEvents(db.audit.slice(0,5)),btn('navigate','View all','data-page="audit"'))}</div></div>`
}
function workload(){
 const name=actor();
 const supervisor=role==='Supervisor'||role==='Administrator';

function reportRecord(kind,id){
 const item=find(kind==='case'?'cases':'arrests',id);
 if(!item||(kind==='case'&&!canViewInvestigation(item))){flash('This report is unavailable for the current demo role.',true);return null}
 return item;
}
function reportView(kind,item,editable=true){
 const sections=reportSections[kind],report=item.report||{};
 const content=sections.map(section=>{
  const entries=section.multiple?(report[section.id]||[]):[report[section.id]||{}];
  const rows=entries.map((entry,index)=>{
   const values=section.fields.filter(([key])=>entry[key]).map(([key,title,type])=>`<div class="list-item"><strong>${esc(title)}:</strong> ${type==='person'?link('person',entry[key],label('people',entry[key])):esc(entry[key])}</div>`).join('');
   const controls=editable&&section.multiple?`<div class="actions no-print">${btn('edit-report-entry','Edit',`data-kind="${kind}" data-id="${esc(item.id)}" data-section="${section.id}" data-index="${index}"`)}${btn('delete-report-entry','Remove',`data-kind="${kind}" data-id="${esc(item.id)}" data-section="${section.id}" data-index="${index}"`)}</div>`:'';
   return `<div class="list-item">${section.multiple?`<strong>Entry ${index+1}</strong>`:''}<div class="list">${values||'<div class="muted">No values recorded.</div>'}</div>${controls}</div>`;
  }).join('')||'<p class="empty">No entries recorded.</p>';
  const action=editable?btn('edit-report-entry',section.multiple?'Add entry':'Edit section',`data-kind="${kind}" data-id="${esc(item.id)}" data-section="${section.id}"`):'';
  return panel(section.title,`<div class="list">${rows}</div>`,action);
 }).join('');
 return `<h2>${kind==='case'?'Case':'Arrest'} report fields${editable?'':' (linked, read-only)'}</h2><p class="muted small">Based on the supplied ${kind==='case'?'DCJS-3205 (11/06)':'DCJS-3203 (4/94)'} example. Illustrative only; not an official form, validation, signature, or submission. Social Security numbers and signatures are not captured. Fields here are report-specific; linked incident and person data remain live and are not copied.</p>${content}`;
}
function reportEntryForm(kind,id,sectionId,index){
 const item=reportRecord(kind,id),section=reportSections[kind]?.find(s=>s.id===sectionId);if(!item||!section)return;
 const entries=(item.report||{})[sectionId],editing=index!==undefined&&index!=='';
 const entry=section.multiple?(editing?(entries||[])[Number(index)]:{}):(entries||{});
 if(!entry){flash('Report entry not found.',true);return}
 const fields=section.fields.map(([key,title,type])=>type==='textarea'?textField(key,title,entry[key]||'',false):type==='person'?selectField(key,title,opts(db.people.map(p=>({id:p.id,text:p.name+' · '+p.id})),entry[key]||'','None'),false):field(key,title,entry[key]||'',type||'text',false)).join('');
 openDialog((editing?'Edit ':section.multiple?'Add ':'Edit ')+section.title,`<div class="fields">${fields}</div><p class="muted small">Fictional data only. Linked person fields show current person information; other fields are specific to this report.</p>`,'Save section',f=>{
  if(!reportRecord(kind,id))return;
  const values=Object.fromEntries(section.fields.map(([key])=>[key,String(f.get(key)||'').trim()]));
  if(section.multiple&&!Object.values(values).some(Boolean)){flash('Enter at least one value.',true);return}
  if(values.person&&!find('people',values.person)){flash('Select a valid demo person.',true);return}
  if(sectionId==='header'&&values.occurredFrom&&values.occurredTo&&values.occurredFrom>values.occurredTo){flash('Occurred to must not be before occurred from.',true);return}
  const before=copy(db),target=find(kind==='case'?'cases':'arrests',id);target.report=target.report||{};
  if(section.multiple){target.report[sectionId]=target.report[sectionId]||[];if(editing)target.report[sectionId][Number(index)]=values;else target.report[sectionId].push(values)}else target.report[sectionId]=values;
  record('Updated '+kind+' '+id+' report section '+section.title);
  if(!persist()){db=before;return}closeDialog();show(kind,id);flash('Report section saved.')
 })
}
function deleteReportEntry(kind,id,sectionId,index){
 const item=reportRecord(kind,id),section=reportSections[kind]?.find(s=>s.id===sectionId&&s.multiple),n=Number(index);
 if(!item||!section||!Number.isInteger(n)||n<0||!item.report?.[sectionId]?.[n]){flash('Report entry not found.',true);return}
 if(!confirm('Remove this report entry?'))return;
 const before=copy(db);item.report[sectionId].splice(n,1);record('Removed '+kind+' '+id+' report entry from '+section.title);
 if(!persist()){db=before;return}render();flash('Report entry removed.')
}
function attachmentsView(kind,item){
 const list=item.attachments||[];
 const rows=list.map((a,index)=>`<div class="list-item"><strong>${esc(a.name)}</strong> · ${esc(a.category)} · ${Math.ceil(a.size/1024)} KB<div class="small muted">Added by ${esc(a.author)} · ${esc(stamp(a.at))}</div>${a.category==='Photograph'&&['image/png','image/jpeg'].includes(a.type)?`<img alt="Fictional attachment ${esc(a.name)}" src="data:${a.type};base64,${a.data}" style="display:block;max-width:180px;max-height:180px;margin:8px 0">`:''}<div class="actions no-print">${btn('download-attachment','Download',`data-kind="${kind}" data-id="${esc(item.id)}" data-index="${index}"`)}${btn('delete-attachment','Remove',`data-kind="${kind}" data-id="${esc(item.id)}" data-index="${index}"`)}</div></div>`).join('')||'<p class="empty">No attachments.</p>';
 return panel('Fictional attachments',`<p class="muted small">Stored unencrypted in this browser and included in JSON exports. PDF, PNG, JPEG or text only; 512 KB per file, 1 MB total. Downloads are not scanned. Case restrictions are only simulated; arrest attachments are visible with the arrest.</p><div class="list">${rows}</div>`,btn('add-attachment','Add attachment',`data-kind="${kind}" data-id="${esc(item.id)}"`));
}
function attachmentForm(kind,id){
 if(!reportRecord(kind,id))return;
 openDialog('Add fictional attachment',`<p class="muted">Do not upload real reports, photographs or sensitive information. Files are stored unencrypted in browser storage and exported with the demo snapshot.</p><div class="fields">${selectField('category','Document type',opts(attachmentCategories.map(id=>({id,text:id}))))}<label class="wide">Fictional file (PDF, PNG, JPEG or text; maximum 512 KB)<input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.txt,application/pdf,image/png,image/jpeg,text/plain" required></label></div>`,'Add attachment',async f=>{
  const file=f.get('file'),category=f.get('category'),types=['application/pdf','image/png','image/jpeg','text/plain'];
  if(!file||!file.name||!file.size||file.size>maxAttachmentBytes||!types.includes(file.type)||!attachmentCategories.includes(category)){flash('Choose a non-empty PDF, PNG, JPEG or text file of at most 512 KB and a document type.',true);return}
  if(category==='Photograph'&&!['image/png','image/jpeg'].includes(file.type)){flash('Photographs must be PNG or JPEG files.',true);return}
  const total=[...db.cases,...db.arrests].flatMap(x=>x.attachments||[]).reduce((sum,a)=>sum+a.size,0);
  if(total+file.size>maxTotalAttachmentBytes){flash('The demo attachment total would exceed 1 MB. Remove an attachment first.',true);return}
  let encoded;const dialog=$('dialog-form'),submit=dialog.querySelector('[type="submit"]'),uploader=actor();submit.disabled=true;
  try{const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));encoded=btoa(binary)}catch(error){flash('Could not read attachment: '+error.message,true);return}finally{submit.disabled=false}
  if($('modal').hidden||$('dialog-form')!==dialog||actor()!==uploader){flash('Attachment was not saved because the dialog or demo role changed.',true);return}
  const target=reportRecord(kind,id);if(!target)return;
  const currentTotal=[...db.cases,...db.arrests].flatMap(x=>x.attachments||[]).reduce((sum,a)=>sum+a.size,0);
  if(currentTotal+file.size>maxTotalAttachmentBytes){flash('The demo attachment total would exceed 1 MB.',true);return}
  const before=copy(db);target.attachments=target.attachments||[];target.attachments.push({name:file.name,type:file.type,size:file.size,category,author:uploader,at:new Date().toISOString(),data:encoded});record('Added attachment to '+kind+' '+id);
  if(!persist()){db=before;return}closeDialog();show(kind,id);flash('Fictional attachment saved.')
 })
}
function attachmentAction(kind,id,index,remove){
 const item=reportRecord(kind,id),n=Number(index);if(!item)return;
 const a=Number.isInteger(n)&&n>=0?(item.attachments||[])[n]:null;if(!a){flash('Attachment not found.',true);return}
 if(remove){if(!confirm('Remove this attachment?'))return;const before=copy(db);item.attachments.splice(n,1);record('Removed attachment from '+kind+' '+id);if(!persist()){db=before;return}render();flash('Attachment removed.');return}
 const bytes=Uint8Array.from(atob(a.data),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'})),anchor=document.createElement('a');anchor.href=url;anchor.download=a.name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function incidentWork(id){

  const previous=i.assignee||'',assignee=f.get('assignee');i.assignee=assignee;i.attention=f.get('attention')==='yes';
  if(previous!==assignee)record('Changed incident '+id+' assignment from '+(previous||'Unassigned')+' to '+(assignee||'Unassigned'));
  record('Updated daily attention for incident '+id+' to '+(i.attention?'flagged':'not flagged'));done('Incident work updated.','incident',id)
 })
}

function generateDemo(){
 const data=copy(db),types=['Burglary / Breaking & Entering','Simple Assault','Motor Vehicle Theft','Vandalism / Damage of Property','Other'],statuses=['Draft','Pending review','Approved','Returned'],officers=['Officer J. Miller','Officer S. Briggs','Officer T. Flores'],detectives=['Detective A. Chen','Detective R. West','Detective M. Diaz'];
 const dateOffset=days=>{const d=new Date();d.setUTCHours(0,0,0,0);d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)};
 for(let n=0;n<36;n++){
  const incidentId=nextId('INC-DEMO-',data.incidents),caseId=nextId('CASE-DEMO-',data.cases),victimId=nextId('P-DEMO-',data.people);
  data.people.push({id:victimId,name:'Fictional Person '+victimId,dob:'',aliases:'None listed',description:'Fictional reporting party'});
  const suspectId=nextId('P-DEMO-',data.people);data.people.push({id:suspectId,name:'Fictional Person '+suspectId,dob:'',aliases:'None listed',description:'Fictional person associated with an investigation'});
  const type=types[n%types.length],date=dateOffset(-2-n*3),location=(100+n*11)+' Demo Street',officer=officers[n%officers.length],assignee=detectives[n%detectives.length],status=statuses[n%statuses.length];
  const incident={id:incidentId,type,location,date,officer,status,narrative:'Fictional training scenario involving '+type.toLowerCase()+'. Investigators are following up on reports and collected items.',people:[{id:victimId,role:'Reporting party'},{id:suspectId,role:'Person of interest'}],vehicles:[],supplements:[],reviewComments:[]};
  if(status==='Approved'||status==='Returned')incident.reviewComments.push({decision:status,text:'Fictional supervisor review.',author:'Supervisor R. Patel',at:date+'T12:00:00Z'});
  if(n%4===0)incident.supplements.push({text:'Fictional follow-up information was recorded.',author:officer,at:date+'T14:00:00Z'});
  data.incidents.push(incident);
  data.cases.push({id:caseId,title:type+' investigation '+incidentId,incidentIds:[incidentId],assignee,status:n%4===2?'Closed':'Open',openedDate:date,access:'Open',notes:'Fictional investigation; review the associated report and follow-up.'});
  const evidenceId=nextId('E-DEMO-',data.evidence);data.evidence.push({id:evidenceId,name:['Scene photograph','Recorded statement','Recovered property'][n%3],incidentId,location:'Demo evidence locker '+(n%4+1),custodian:officer,history:[{date,from:'Collected',to:officer,note:'Fictional intake'}]});
  const taskId=nextId('T-DEMO-',data.tasks);data.tasks.push({id:taskId,title:['Review evidence','Contact reporting party','Prepare follow-up'][n%3],caseId,assignee,due:dateOffset(10-n),status:n%4===2?'Completed':'Open'});
  if(n%3===0){const id=nextId('V-DEMO-',data.vehicles);data.vehicles.push({id,description:['Fictional blue sedan','Fictional white van','Fictional gray pickup'][(n/3)%3],plate:'DEMO-'+id,incidentIds:[incidentId]});incident.vehicles.push(id)}
  if(n%4===1){const id=nextId('W-DEMO-',data.warrants);data.warrants.push({id,personId:suspectId,type:'Fictional bench warrant',status:'Listed in demo',issued:date,note:'Fictional record. Status and identity have not been verified.',checks:[]})}
  if(n%2===0){const id=nextId('ARR-DEMO-',data.arrests);data.arrests.push({id,caseId,personId:suspectId,date:dateOffset(-1-n*3),location,officer,assignee:officer,workStatus:'Open',charge:type,notes:'Fictional arrest for demonstration only.'})}
 }
 data.audit.unshift({at:new Date().toISOString(),actor:actor(),action:'Added 36 connected fictional demo scenarios'});
 if(!validSnapshot(data)){flash('Generated demo data failed validation; existing records were not changed.',true);return}
 try{localStorage.setItem(KEY,JSON.stringify(data))}catch(error){flash('Could not save generated demo data: '+error.message,true);return}
 db=data;show('dashboard');flash('Added 36 connected fictional demo scenarios.')
}
function validSnapshot(data){
 const object=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const str=(x,keys)=>object(x)&&keys.every(k=>typeof x[k]==='string');
 const ids=x=>Array.isArray(x)&&x.every(v=>typeof v==='string');
 const arrays=['incidents','people','vehicles','cases','evidence','warrants','tasks','audit'];
 if(!object(data)||data.version!==1||!arrays.every(k=>Array.isArray(data[k])))return false;
 if(data.arrests!==undefined&&!Array.isArray(data.arrests))return false;
 const arrests=data.arrests===undefined?[]:data.arrests;
 if(!data.incidents.every(x=>str(x,['id','type','location','date','officer','status','narrative'])&&['Draft','Returned','Pending review','Approved'].includes(x.status)&&Array.isArray(x.people)&&x.people.every(p=>str(p,['id','role']))&&ids(x.vehicles)&&Array.isArray(x.supplements)&&x.supplements.every(s=>str(s,['text','author','at']))&&Array.isArray(x.reviewComments)&&x.reviewComments.every(c=>str(c,['decision','text','author','at']))))return false;
 if(!data.people.every(x=>str(x,['id','name','dob','aliases','description']))||!data.vehicles.every(x=>str(x,['id','description','plate'])&&ids(x.incidentIds))||!data.cases.every(x=>str(x,['id','title','assignee','status','notes'])&&['Open','Closed'].includes(x.status)&&ids(x.incidentIds)))return false;
 if(!data.evidence.every(x=>str(x,['id','name','incidentId','location','custodian'])&&Array.isArray(x.history)&&x.history.every(h=>str(h,['date','from','to','note'])))||!data.warrants.every(x=>str(x,['id','personId','type','status','issued','note'])&&Array.isArray(x.checks)&&x.checks.every(c=>str(c,['text','author','at']))))return false;
 if(!data.tasks.every(x=>str(x,['id','title','caseId','assignee','due','status'])&&['Open','Completed'].includes(x.status))||!data.audit.every(x=>str(x,['at','actor','action'])))return false;
 if(!arrests.every(x=>str(x,['id','caseId','personId','date','location','officer','charge','notes']))||new Set(arrests.map(x=>x.id)).size!==arrests.length)return false;
 if(!data.incidents.every(x=>(x.assignee===undefined||typeof x.assignee==='string')&&(x.attention===undefined||typeof x.attention==='boolean')))return false;
 if(!data.cases.every(x=>(x.openedDate===undefined||typeof x.openedDate==='string')&&(x.access===undefined||['Open','Restricted'].includes(x.access))&&(x.accessUsers===undefined||ids(x.accessUsers))))return false;
 if(!arrests.every(x=>(x.assignee===undefined||typeof x.assignee==='string')&&(x.workStatus===undefined||['Open','Completed'].includes(x.workStatus))))return false;
 const validReport=(item,kind)=>item.report===undefined||(object(item.report)&&Object.entries(item.report).every(([key,value])=>{
  const section=reportSections[kind].find(s=>s.id===key);if(!section)return false;
  const validEntry=entry=>object(entry)&&Object.entries(entry).every(([field,value])=>section.fields.some(f=>f[0]===field)&&typeof value==='string')&&(!entry.person||data.people.some(p=>p.id===entry.person));
  return section.multiple?Array.isArray(value)&&value.every(validEntry):validEntry(value);
 }));
 const validAttachment=a=>{
  if(!str(a,['name','type','category','author','at','data'])||!a.name||!['application/pdf','image/png','image/jpeg','text/plain'].includes(a.type)||!attachmentCategories.includes(a.category)||!Number.isInteger(a.size)||a.size<1||a.size>maxAttachmentBytes||(a.category==='Photograph'&&!['image/png','image/jpeg'].includes(a.type))||a.data.length!==4*Math.ceil(a.size/3)||!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(a.data))return false;
  try{return atob(a.data).length===a.size}catch(error){return false}
 };
 if(!data.cases.every(x=>validReport(x,'case'))||!arrests.every(x=>validReport(x,'arrest')))return false;
 const reportRecords=[...data.cases,...arrests];
 if(!reportRecords.every(x=>x.attachments===undefined||(Array.isArray(x.attachments)&&x.attachments.every(validAttachment))))return false;
 if(reportRecords.flatMap(x=>x.attachments||[]).reduce((sum,a)=>sum+a.size,0)>maxTotalAttachmentBytes)return false;
 for(const key of arrays.filter(x=>x!=='audit'))if(new Set(data[key].map(x=>x.id)).size!==data[key].length)return false;
 const has=(key,id)=>data[key].some(x=>x.id===id);
 return data.incidents.every(x=>x.people.every(p=>has('people',p.id))&&x.vehicles.every(id=>has('vehicles',id)))&&data.vehicles.every(x=>x.incidentIds.every(id=>has('incidents',id)))&&data.cases.every(x=>x.incidentIds.every(id=>has('incidents',id)))&&data.evidence.every(x=>has('incidents',x.incidentId))&&data.warrants.every(x=>has('people',x.personId))&&data.tasks.every(x=>!x.caseId||has('cases',x.caseId))&&arrests.every(x=>has('cases',x.caseId)&&has('people',x.personId));
}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw){db=copy(initialData);persist();return}const parsed=JSON.parse(raw);if(!validSnapshot(parsed))throw new Error('Stored data is invalid');db=parsed;if(db.arrests===undefined)db.arrests=[]}catch(error){db=copy(initialData);flash('Could not load stored demo data: '+error.message+'. Sample data is shown without replacing storage.',true)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='navigate')show(b.dataset.page);else if(a==='open')show(b.dataset.page,id);else if(a==='search')show('search',null,$('search').value);else if(a==='close-modal')closeDialog();else if(a==='print')window.print();else if(a==='new-incident')incidentForm();else if(a==='edit-incident')incidentForm(id);else if(a==='incident-work')incidentWork(id);else if(a==='arrest-work')arrestWork(id);else if(a==='new-person')personForm();else if(a==='edit-person')personForm(id);else if(a==='new-vehicle')vehicleForm();else if(a==='link-person')linkPerson(id);else if(a==='supplement')supplement(id);else if(a==='new-case')caseForm(null,id);else if(a==='edit-case')caseForm(id);else if(a==='new-arrest')arrestForm(id);else if(a==='edit-arrest'){const arrest=find('arrests',id);if(!arrest){flash('Arrest not found.',true);return}arrestForm(arrest.caseId,id)}else if(a==='edit-report-entry')reportEntryForm(b.dataset.kind,id,b.dataset.section,b.dataset.index);else if(a==='delete-report-entry')deleteReportEntry(b.dataset.kind,id,b.dataset.section,b.dataset.index);else if(a==='add-attachment')attachmentForm(b.dataset.kind,id);else if(a==='download-attachment')attachmentAction(b.dataset.kind,id,b.dataset.index,false);else if(a==='delete-attachment')attachmentAction(b.dataset.kind,id,b.dataset.index,true);else if(a==='generate-demo')generateDemo();else if(a==='new-evidence')evidenceForm(id);else if(a==='transfer')transfer(id);else if(a==='new-task')taskForm(id);else if(a==='review-decision')reviewForm(id);else if(a==='warrant-note')warrantNote(id);else if(a==='clear-filters'){reportFilters={from:'',to:'',type:'',status:''};render()}
 else if(a==='submit-incident'){const x=find('incidents',id);if(!x||!['Draft','Returned'].includes(x.status)){flash('Only draft or returned reports can be submitted.',true);return}x.status='Pending review';record('Submitted incident '+id+' for review');if(persist()){show('incident',id);flash('Submitted to the simulated review queue.')}}
 else if(a==='toggle-task'){const t=find('tasks',id);if(!t||(t.caseId&&!canViewInvestigation(find('cases',t.caseId)))){flash('Task is unavailable for the current demo role.',true);return}t.status=t.status==='Open'?'Completed':'Open';record('Marked task '+id+' '+t.status.toLowerCase());if(persist()){render();flash('Task updated.')}}
 else if(a==='reset'){if(confirm('Replace all demo records with the original fictional sample data?')){db=copy(initialData);if(persist()){show('dashboard');flash('Demo data reset.')}}}
 else if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='arachne-rms-demo.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 else if(a==='import')$('import-file').click();
});
$('role').addEventListener('change',e=>{role=e.target.value;render();flash('Demo role changed to '+role+'. This is not authentication.')});
document.addEventListener('submit',e=>{if(e.target.id==='daily-filter'){e.preventDefault();const f=new FormData(e.target);dailyDate=f.get('date');render();return}if(e.target.id!=='report-filters')return;e.preventDefault();const f=new FormData(e.target);if(f.get('from')&&f.get('to')&&f.get('from')>f.get('to')){flash('The start date must not be after the end date.',true);return}reportFilters={from:f.get('from'),to:f.get('to'),type:f.get('type'),status:f.get('status')};render()});
$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();show('search',null,e.target.value)}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeDialog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeDialog()});
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const parsed=JSON.parse(await file.text());if(!validSnapshot(parsed))throw new Error('Invalid or incompatible demo snapshot');if(!confirm('Replace all current demo records with this snapshot?'))return;db=parsed;if(db.arrests===undefined)db.arrests=[];if(persist()){show('dashboard');flash('Demo snapshot imported.')}}catch(error){flash('Import failed: '+error.message,true)}});
load();render();
</script>
